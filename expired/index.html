<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learning Period Expired</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f8fc 0%, #eef3f9 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .expiry-card {
            max-width: 560px;
            width: 100%;
            background: #ffffff;
            border: none;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
            padding: 50px 40px;
            text-align: center;
        }

        .expiry-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: #fff3cd;
            color: #d39e00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .expiry-card h1 {
            color: #1f2937;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .expiry-card .lead {
            color: #4b5563;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .expiry-message {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .info-box {
            background: #f8fafc;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 30px;
            color: #4b5563;
            font-size: 14px;
        }

        .btn-primary-custom {
            background: #0d6efd;
            border: none;
            border-radius: 10px;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary-custom:hover {
            background: #0b5ed7;
            transform: translateY(-1px);
        }

        .support-text {
            margin-top: 22px;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 576px) {
            .expiry-card {
                margin: 20px;
                padding: 40px 25px;
            }

            .expiry-card h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="expiry-card mx-auto">

            <!-- Icon -->
            <div class="expiry-icon text-danger">
                <i class="bi bi-calendar-x"></i>
            </div>

            <!-- Heading -->
            <h1>Your Learning Period Has Ended</h1>

            <!-- Main message -->
            <p class="lead">
                Your 30-day learning period has expired.
            </p>

            <p class="expiry-message">
                We hope you had a valuable learning experience during your
                time with us. Your access to the learning platform has now
                ended because the 30-day learning period has been exceeded.
            </p>

            <!-- <a href="mailto:elizabeth@remsana.com?subject=Learning%20Period%20Expired" class="btn btn-primary-custom">
                <i class="bi bi-headset me-2"></i>
                Contact Support
            </a>

            <div class="support-text">
                Need help? Our support team will be happy to assist you.
            </div> -->

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
